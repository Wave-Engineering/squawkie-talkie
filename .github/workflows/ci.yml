name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request: {}
  # Backfill: build & publish a tag that was cut before the publish job existed.
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag to build & publish to GHCR (e.g. v0.6.0)"
        required: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Validate the exact code being shipped — the tag on a backfill dispatch,
          # otherwise the triggering commit (identical to checkout's default).
          ref: ${{ github.event.inputs.ref || github.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"
      - run: bun install
      - run: bun run typecheck
      - run: bun test

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"
      - run: bun install
      - run: bun run build
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:e2e

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.sha }}
      - run: docker build -t squawkie-talkie .
      - run: ./scripts/ci/docker-smoke.sh

  # Publish the container image to the org GHCR on a version tag (or a manual
  # backfill dispatch). Never runs on PRs or branch pushes. Gated behind the
  # validation jobs — which now check out the same ref — so a broken build never
  # ships an image.
  publish:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: [test, e2e, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # keyless cosign (Fulcio/Rekor) via the shared oaw-sign-image action
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      release_refs: ${{ steps.mirror.outputs.release-refs }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.sha }}
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # NOTE: Docker Hub login is deliberately AFTER the build (see flightdeck #20). The
      # oakandwave Org Access Token is scoped to oakandwave/* only; logging into Docker Hub
      # before the build makes buildx present it for the oven/bun base pull and fail with
      # 401. Building with no Docker Hub creds keeps that public pull anonymous.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/wave-engineering/squawkie-talkie
          # Force the OCI source/url labels lowercase (metadata-action's auto-source would
          # otherwise bake the org's capitalized "Wave-Engineering" URL).
          labels: |
            org.opencontainers.image.source=https://github.com/wave-engineering/squawkie-talkie
            org.opencontainers.image.url=https://github.com/wave-engineering/squawkie-talkie
          # Bare version tag (no `v` prefix) to match the manual push + Docker/OCI
          # convention: git tag `v0.6.0` → image `0.6.0`. `latest` only on a real
          # tag push, so a backfill of an older tag never drags `latest` backward.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{version}},value=${{ github.event.inputs.ref }},enable=${{ github.event_name == 'workflow_dispatch' }}
            type=raw,value=latest,enable=${{ github.event_name != 'workflow_dispatch' }}
      - name: Build and push (GHCR)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Sign the GHCR image (cosign keyless + SBOM)
        # Consumer of cc-workflow's reusable oaw-sign-image action (fleet signing). Signs the
        # immutable digest; the GHCR login above is active and id-token grants OIDC. Small
        # image -> SBOM to rekor (action default), no TSA.
        uses: wave-engineering/claudecode-workflow/.github/actions/oaw-sign-image@21f10ce601b9340b30fd6df0b4a2e4bd663fe249
        with:
          digest-ref: ghcr.io/wave-engineering/squawkie-talkie@${{ steps.build.outputs.digest }}

      - name: Log in to Docker Hub
        # AFTER the build (see the note above): the OAT is only ever presented to docker.io
        # for the oakandwave push it is scoped for. Serves both the mirror and Scout below.
        uses: docker/login-action@v3
        with:
          username: oakandwave
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Mirror the GHCR digest to Docker Hub oakandwave
        # Shared oaw-mirror-image action (claudecode-workflow#1326): copies the exact digest
        # under every tag, but pushes a version tag (X.Y.Z) only when it is absent, and fails
        # with nothing pushed if one already names another digest. Rebuilds nothing.
        id: mirror
        uses: wave-engineering/claudecode-workflow/.github/actions/oaw-mirror-image@d82d57ba3553ea5f82d3267f7c1e98d944a07a3a
        with:
          source-digest-ref: ghcr.io/wave-engineering/squawkie-talkie@${{ steps.build.outputs.digest }}
          tags: ${{ steps.meta.outputs.tags }}
          dest-image: docker.io/oakandwave/squawkie-talkie

      - name: Sign the Docker Hub image (cosign keyless + SBOM)
        # Same digest as GHCR (imagetools copies content-identical); cosign sigs are
        # registry+digest-bound so the mirror needs its own signature. Docker Hub login active.
        uses: wave-engineering/claudecode-workflow/.github/actions/oaw-sign-image@21f10ce601b9340b30fd6df0b4a2e4bd663fe249
        with:
          digest-ref: docker.io/oakandwave/squawkie-talkie@${{ steps.build.outputs.digest }}

      - name: Docker Scout — CVE scan the pushed image
        # Non-blocking; continue-on-error covers ALL failures (auth/infra), so a Scout error
        # can't red a release whose dual-push already succeeded (flightdeck #20 review).
        continue-on-error: true
        uses: docker/scout-action@v1
        with:
          command: cves
          image: docker.io/oakandwave/squawkie-talkie:${{ steps.meta.outputs.version }}
          only-severities: critical,high
          write-comment: false

  # Write the image's digest-pinned refs into the GitHub release. Its own job, after the
  # mirror and both signatures, so a release-API failure can't stop a signature, and
  # contents: write sits on a job that runs no registry or signing tooling.
  release-notes:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Write the image digest into the release
        # Releases here are written after CI, so on a tag push a missing one is created
        # (generated notes); an existing one gets the Images block appended, or replaced on a
        # rerun. A backfill dispatch never creates one: a release created today for an old tag
        # could be marked latest, dragging it backward, as the `latest` image tag above refuses to.
        uses: wave-engineering/claudecode-workflow/.github/actions/oaw-release-images@d82d57ba3553ea5f82d3267f7c1e98d944a07a3a
        with:
          release-tag: ${{ github.event.inputs.ref || github.ref_name }}
          release-refs: ${{ needs.publish.outputs.release_refs }}
          source-digest-ref: ghcr.io/wave-engineering/squawkie-talkie@${{ needs.publish.outputs.digest }}
          create-if-missing: ${{ github.event_name != 'workflow_dispatch' }}
